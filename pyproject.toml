[project]
name = "aimaligator"
version = "0.3.3"
description = "Alert-only watchdog for local AI assistant tooling (Bionic / LM Studio)."
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
aimaligator = "aimaligator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
